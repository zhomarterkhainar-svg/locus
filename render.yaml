# Candid AI на Render (Blueprint): два сервиса - API с моделями и статический фронтенд.
# Развернуть: Render -> New -> Blueprint -> этот репозиторий.
#
# Бесплатный инстанс API - 512 МБ памяти, поэтому сервис работает на ONNX Runtime без PyTorch:
# веса всех моделей занимают ~100 МБ, старт занимает секунды.
#
# Фронтенд тоже описан здесь, чтобы оба сервиса поднимались одним блюпринтом: Render отдаёт
# статику бесплатно и не засыпает. Разворачивать фронтенд на Vercel, Cloudflare Pages или
# Netlify тоже можно - достаточно собрать frontend/ с переменной VITE_API_BASE
# и вписать домен в CORS_ORIGINS.
#
# Секреты (Render -> Environment) задаются вручную и в репозиторий не попадают:
#   GEMINI_API_KEY   - описание кампуса со сносками (без него показываются выдержки из источников)
#   FLICKR_API_KEY   - дополнительный источник фото (необязательно)
#   SUPABASE_URL     - https://<проект>.supabase.co
#   SUPABASE_KEY     - service_role ключ проекта Supabase
services:
  - type: web
    name: candid-ai-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      pip install --no-cache-dir -r backend/requirements.txt
      python scripts/download_models.py
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Бесплатный инстанс - половина ядра: два потока ONNX дают лучшее время на кадр.
      - key: ONNX_THREADS
        value: "2"
      - key: ONNX_MEM_ARENA
        value: "false"
      - key: CACHE_DIR
        value: /tmp/candid-cache
      # Прогрев карт при старте на слабом инстансе только мешает первым запросам:
      # частые вузы и так лежат в backend/seed_cache и в общем кэше Supabase.
      - key: PREWARM
        value: "false"
      - key: TOTAL_BUDGET
        value: "12"
      # Потолок всей сборки. На бесплатном инстансе доля ядра считает партию фото дольше бюджета:
      # без этого запаса проверка обрывалась на полпути и фонд оставался пустым.
      - key: ANALYZE_BUDGET
        value: "90"
      # Столько файлов успевает пройти через модель за отведённый потолок на слабом инстансе.
      - key: MAX_DOWNLOADS
        value: "48"
      - key: DOWNLOAD_CONCURRENCY
        value: "16"
      # Мелкая партия доходит до конца и сразу показывается: при обрыве по потолку
      # теряется шесть кадров, а не дюжина.
      - key: ANALYZE_CHUNK
        value: "6"
      # Кадр для анализа: модели хватает 224 px, меньший разбор экономит память на инстансе 512 МБ.
      - key: ANALYZE_SIDE
        value: "384"
      # Домен статического сервиса ниже Render подставит сам после первого деплоя;
      # сюда можно дописать и другие домены фронтенда через запятую.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: candid-ai-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CONTACT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FLICKR_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # Фронтенд: статическая сборка Vite, раздаётся CDN Render, бесплатно и без засыпания.
  - type: web
    name: candid-ai-web
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Адрес API. После первого деплоя Render подставит настоящий домен сервиса candid-ai-api.
      - key: VITE_API_BASE
        fromService:
          type: web
          name: candid-ai-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Одностраничное приложение: любой путь отдаёт index.html, роутер разберётся сам.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
