name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Кэш моделей ONNX
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('backend/app/vision/onnx_backend.py') }}
      - name: Модели и проверочные фото
        run: |
          python scripts/download_models.py
          python ml/fetch_eval_images.py || echo "часть проверочных фото не скачалась, сквозной тест пропустится"
      - name: Тесты
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
